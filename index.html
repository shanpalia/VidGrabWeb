<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidGrab - By PaliaAPK HUB</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#10b981',
                            600: '#059669',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-500 text-white p-2.5 rounded-xl shadow-md flex items-center justify-center">
                    <i class="fa-solid fa-circle-down text-xl"></i>
                </div>
                <div>
                    <span class="text-2xl font-black text-gray-900 block leading-none">VidGrab</span>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-brand-600">By PaliaAPK HUB</span>
                </div>
            </div>
            
            <a href="download.html" class="bg-brand-50 text-brand-700 border border-brand-200 px-3 py-1.5 rounded-full text-xs font-bold hover:bg-brand-100 transition">
                <i class="fa-solid fa-download mr-1"></i> Downloads
            </a>
        </div>
    </header>

    <!-- Main Homepage Content -->
    <main class="flex-grow max-w-5xl mx-auto px-4 py-8 w-full space-y-8">

        <!-- Input Box -->
        <div class="text-center space-y-4">
            <h1 class="text-3xl font-extrabold text-gray-900">Full-Page Browser Grabber</h1>
            <p class="text-gray-500 text-sm">Kisi bhi website ka poora live page browser me kholne ke liye niche click karein.</p>
            
            <div class="max-w-2xl mx-auto bg-white p-2.5 rounded-2xl border border-gray-200 shadow-xl flex gap-2">
                <input type="text" id="urlInput" placeholder="Type web URL (e.g., https://youtube.com)..." class="w-full bg-gray-50 text-gray-900 px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                <button onclick="openCustomUrl()" class="bg-brand-500 hover:bg-brand-600 text-white font-bold px-6 py-3 rounded-xl transition text-sm cursor-pointer whitespace-nowrap">
                    <i class="fa-solid fa-globe mr-1"></i> Open Page
                </button>
            </div>
        </div>

        <!-- Platform Shortcuts (Opens Full Page) -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <button onclick="openFullBrowser('https://www.youtube.com', 'YouTube')" class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm hover:shadow-md transition flex items-center space-x-3 cursor-pointer">
                <i class="fa-brands fa-youtube text-red-600 text-2xl"></i>
                <span class="font-bold text-sm text-gray-800">YouTube</span>
            </button>
            <button onclick="openFullBrowser('https://www.wikipedia.org', 'Wikipedia')" class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm hover:shadow-md transition flex items-center space-x-3 cursor-pointer">
                <i class="fa-solid fa-globe text-blue-600 text-2xl"></i>
                <span class="font-bold text-sm text-gray-800">Wikipedia</span>
            </button>
            <button onclick="openFullBrowser('https://news.google.com', 'Google News')" class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm hover:shadow-md transition flex items-center space-x-3 cursor-pointer">
                <i class="fa-solid fa-newspaper text-emerald-600 text-2xl"></i>
                <span class="font-bold text-sm text-gray-800">News Feed</span>
            </button>
            <button onclick="openFullBrowser('https://archive.org', 'Internet Archive')" class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm hover:shadow-md transition flex items-center space-x-3 cursor-pointer">
                <i class="fa-solid fa-video text-purple-600 text-2xl"></i>
                <span class="font-bold text-sm text-gray-800">Media Archive</span>
            </button>
        </div>

    </main>

    <!-- FULLSCREEN FULL-PAGE BROWSER MODAL -->
    <div id="browserModal" class="fixed inset-0 bg-gray-900 z-50 hidden flex flex-col w-full h-full">
        
        <!-- Browser Address Bar -->
        <div class="bg-gray-800 text-white px-4 py-2.5 flex items-center justify-between gap-3 shadow-md border-b border-gray-700">
            <button onclick="closeBrowser()" class="bg-gray-700 hover:bg-brand-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer transition flex items-center space-x-1">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </button>

            <!-- URL Display -->
            <div class="flex-grow max-w-xl bg-gray-900 border border-gray-700 px-3 py-1.5 rounded-lg text-xs text-gray-300 truncate">
                <i class="fa-solid fa-lock text-emerald-500 mr-1.5"></i>
                <span id="currentUrlText">https://...</span>
            </div>

            <button onclick="closeBrowser()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer">
                <i class="fa-solid fa-xmark mr-1"></i> Exit
            </button>
        </div>

        <!-- Full Page Content Frame -->
        <div class="flex-grow bg-white relative">
            <iframe id="fullPageIframe" src="" class="w-full h-full border-0"></iframe>

            <!-- VidMate Style Floating Red Grab Arrow Button -->
            <button onclick="openFormatModal()" class="absolute bottom-6 right-6 bg-red-600 hover:bg-red-700 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-2xl animate-bounce border-2 border-white cursor-pointer z-30">
                <i class="fa-solid fa-arrow-down"></i>
            </button>
        </div>
    </div>

    <!-- FORMAT SELECTION POPUP -->
    <div id="formatModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-5">
            <div class="flex items-center justify-between border-b border-gray-100 pb-3">
                <h3 class="font-bold text-gray-900 text-base">Select Quality Format</h3>
                <button onclick="closeFormatModal()" class="text-gray-400 hover:text-gray-600 cursor-pointer">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-3">
                <span class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Available Formats</span>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="sendToDownloadPage('1080p HD', 'MP4', '45 MB')" class="p-2.5 bg-gray-50 hover:bg-brand-50 border border-gray-200 hover:border-brand-500 rounded-xl text-center cursor-pointer transition">
                        <div class="text-xs font-bold text-gray-800">1080p HD</div>
                        <div class="text-[10px] text-gray-500">45 MB</div>
                    </button>
                    <button onclick="sendToDownloadPage('720p HD', 'MP4', '22 MB')" class="p-2.5 bg-gray-50 hover:bg-brand-50 border border-gray-200 hover:border-brand-500 rounded-xl text-center cursor-pointer transition">
                        <div class="text-xs font-bold text-gray-800">720p HD</div>
                        <div class="text-[10px] text-gray-500">22 MB</div>
                    </button>
                    <button onclick="sendToDownloadPage('Audio MP3', 'MP3', '8 MB')" class="p-2.5 bg-gray-50 hover:bg-purple-50 border border-gray-200 hover:border-purple-500 rounded-xl text-center cursor-pointer transition">
                        <div class="text-xs font-bold text-gray-800">MP3 Audio</div>
                        <div class="text-[10px] text-gray-500">8 MB</div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-6 mt-12 text-center text-xs text-gray-500 space-y-1">
        <p class="font-semibold text-gray-700">&copy; 2026 VidGrab By PaliaAPK HUB. All Rights Reserved.</p>
        <p class="text-gray-400">Developer by <span class="text-brand-600 font-bold">shanpalia</span></p>
    </footer>

    <!-- Script -->
    <script>
        function openFullBrowser(url, title) {
            document.getElementById('currentUrlText').innerText = url;
            // Using a standard embed proxy-friendly target or fallback URL to ensure full-page visibility
            document.getElementById('fullPageIframe').src = url;
            document.getElementById('browserModal').classList.remove('hidden');
        }

        function openCustomUrl() {
            let val = document.getElementById('urlInput').value.trim();
            if(!val) {
                alert('Please enter a valid URL!');
                return;
            }
            if(!val.startsWith('http')) {
                val = 'https://' + val;
            }
            openFullBrowser(val, 'Custom Web Page');
        }

        function closeBrowser() {
            document.getElementById('fullPageIframe').src = "";
            document.getElementById('browserModal').classList.add('hidden');
        }

        function openFormatModal() {
            document.getElementById('formatModal').classList.remove('hidden');
        }

        function closeFormatModal() {
            document.getElementById('formatModal').classList.add('hidden');
        }

        function sendToDownloadPage(quality, type, size) {
            const downloadData = {
                title: "Extracted Full-Page Media Stream",
                thumb: "https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg",
                quality: quality,
                type: type,
                size: size,
                date: new Date().toLocaleTimeString()
            };

            localStorage.setItem('vidgrab_active_download', JSON.stringify(downloadData));
            window.location.href = 'download.html';
        }
    </script>
</body>
</html>
